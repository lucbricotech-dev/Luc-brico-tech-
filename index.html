<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LUC BRICO-TECH — Gestion & Supervision</title>

  <link rel="stylesheet" href="./style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Configuration Supabase -->
  <script src="./config.js"></script>
</head>

<body>

  <!-- ==============================
       NOTIFICATION
  =============================== -->
  <div id="toast" class="toast"></div>


  <!-- ==============================
       APPLICATION
  =============================== -->
  <div class="app">

    <!-- ==============================
         SIDEBAR
    =============================== -->
    <aside id="sidebar" class="sidebar">

      <!-- IDENTITÉ / LOGO -->
      <div class="brand brand-logo">

        <div class="brand-image-wrapper">
          <img
            src="./logo-luc-bricotech.png"
            alt="Logo LUC BRICO-TECH"
            class="brand-logo-img"
            onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';"
          >

          <!-- Affiché uniquement si le fichier logo est introuvable -->
          <div id="logoFallback" class="logo-fallback" style="display:none;">
            LBT
          </div>
        </div>

        <div class="brand-text">
          <strong>LUC BRICO-TECH</strong>
          <small>Gestion &amp; supervision</small>
        </div>

      </div>


      <!-- ==============================
           NAVIGATION
      =============================== -->
      <nav id="nav" class="main-nav">

        <button
          type="button"
          data-page="dashboard"
          class="nav-btn">
          <span class="nav-icon">📊</span>
          <span>Tableau de bord</span>
        </button>

        <button
          type="button"
          data-page="members"
          class="nav-btn">
          <span class="nav-icon">👥</span>
          <span>Membres</span>
        </button>

        <button
          type="button"
          data-page="sales"
          class="nav-btn">
          <span class="nav-icon">💰</span>
          <span>Ventes</span>
        </button>

        <button
          type="button"
          data-page="purchases"
          class="nav-btn">
          <span class="nav-icon">🛒</span>
          <span>Achats</span>
        </button>

        <button
          type="button"
          data-page="expenses"
          class="nav-btn">
          <span class="nav-icon">💳</span>
          <span>Dépenses</span>
        </button>

        <button
          type="button"
          data-page="stock"
          class="nav-btn">
          <span class="nav-icon">📦</span>
          <span>Stock &amp; matériel</span>
        </button>

        <button
          type="button"
          data-page="activities"
          class="nav-btn">
          <span class="nav-icon">🔧</span>
          <span>Activités</span>
        </button>

        <button
          type="button"
          data-page="projects"
          class="nav-btn">
          <span class="nav-icon">🏗️</span>
          <span>Projets</span>
        </button>

        <button
          type="button"
          data-page="innovations"
          class="nav-btn">
          <span class="nav-icon">💡</span>
          <span>Innovations</span>
        </button>

        <button
          type="button"
          data-page="reports"
          class="nav-btn">
          <span class="nav-icon">📈</span>
          <span>Rapports</span>
        </button>

        <button
          type="button"
          data-page="audit"
          class="nav-btn">
          <span class="nav-icon">🕘</span>
          <span>Journal</span>
        </button>

        <button
          type="button"
          data-page="settings"
          class="nav-btn">
          <span class="nav-icon">⚙️</span>
          <span>Paramètres</span>
        </button>

      </nav>


      <!-- ==============================
           BAS DE SIDEBAR
      =============================== -->
      <div class="side-footer">

        <span
          id="modeBadge"
          class="badge">
          MODE DÉMO
        </span>

        <button
          type="button"
          id="logoutBtn"
          class="danger ghost">
          Déconnexion
        </button>

      </div>

    </aside>


    <!-- ==============================
         CONTENU PRINCIPAL
    =============================== -->
    <main class="main">


      <!-- ==============================
           BARRE SUPÉRIEURE
      =============================== -->
      <header class="topbar">

        <!-- Menu mobile -->
        <button
          type="button"
          id="menuBtn"
          class="icon-btn"
          aria-label="Ouvrir le menu">
          ☰
        </button>


        <!-- TITRE -->
        <div class="topbar-title">

          <h1 id="pageTitle">
            Tableau de bord
          </h1>

          <p id="pageSub">
            Vue générale de l’activité.
          </p>

        </div>


        <!-- UTILISATEUR CONNECTÉ -->
        <div class="userbox">

          <div
            id="userName"
            class="user-name">
            Invité
          </div>

          <span
            id="userRole"
            class="badge">
            —
          </span>

        </div>

      </header>


      <!-- ==============================
           CONTENU DYNAMIQUE
      =============================== -->
      <section
        id="content"
        class="content">

        <!-- Le contenu du tableau de bord
             et des autres pages est généré
             par script.js -->

      </section>

    </main>

  </div>


  <!-- ==============================
       MODALE
  =============================== -->
  <div
    id="modal"
    class="modal hidden"
    aria-hidden="true">

    <div class="modal-card">

      <div class="modal-head">

        <h2 id="modalTitle">
          Ajouter
        </h2>

        <button
          type="button"
          id="closeModal"
          class="icon-btn"
          aria-label="Fermer">
          ✕
        </button>

      </div>

      <form
        id="recordForm"
        autocomplete="off">
      </form>

    </div>

  </div>


  <!-- ==============================
       JAVASCRIPT
  =============================== -->
  <script src="./script.js"></script>

</body>
</html>
